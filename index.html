<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Alien 记账</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000; --card:#0b130d; --card2:#101c12; --line:#1d3323;
    --neon:#39ff14; --mint:#b6ffc0; --deep:#0f5a24; --soft:#6bdc7a;
    --text:#eafff0; --dim:#7fa58a; --warn:#ffd23f; --bad:#ff5a5a;
    --pixel:"Press Start 2P", monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  body{min-height:100vh;padding:14px 16px 124px;max-width:560px;margin:0 auto;
    background:radial-gradient(120% 60% at 50% -10%, #0d2a14 0%, #000 60%) no-repeat, #000}
  h1{font-size:18px;margin:6px 0 12px;color:var(--neon);font-family:var(--pixel);line-height:1.5}
  .card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
    border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:0 0 0 1px #000 inset,0 8px 30px #00000066}
  .muted{color:var(--dim);font-size:13px}
  .big{font-size:34px;font-weight:800;color:var(--neon);text-shadow:0 0 18px #39ff1455}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .pixel{font-family:var(--pixel);font-size:10px;letter-spacing:.5px;color:var(--mint)}
  .pill{display:inline-block;padding:9px 15px;border-radius:999px;border:1px solid var(--line);
    background:#070d08;color:var(--text);font-size:14px;margin:4px 4px 4px 0;cursor:pointer;user-select:none;
    transition:transform .12s, background .2s}
  .pill:active{transform:scale(.95)}
  .pill.on{background:linear-gradient(180deg,#5dff3a,#2fd60f);color:#001a00;border-color:transparent;font-weight:700;
    box-shadow:0 0 16px #39ff1466}
  .btn{width:100%;padding:15px;border-radius:999px;border:0;background:linear-gradient(180deg,#5dff3a,#2fd60f);
    color:#001a00;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 6px 24px #39ff1455}
  .btn:active{transform:translateY(1px)}
  input{width:100%;padding:13px 15px;border-radius:16px;border:1px solid var(--line);
    background:#050a06;color:var(--text);font-size:16px;margin-top:6px;outline:none}
  input:focus{border-color:var(--soft)}
  label{display:block;margin-top:12px;font-size:13px;color:var(--dim)}

  /* 头部 Alien */
  .hero{display:flex;gap:14px;align-items:center}
  .alien{width:110px;height:110px;flex:0 0 auto;image-rendering:pixelated;filter:drop-shadow(0 0 12px #39ff1466);
    animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .bubble{position:relative;background:#0d1a10;border:1px solid var(--line);border-radius:18px;padding:10px 12px;
    font-size:14px;color:var(--mint);flex:1}
  .bubble:before{content:"";position:absolute;left:-7px;top:18px;width:12px;height:12px;background:#0d1a10;
    border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
  .xp{height:12px;border-radius:999px;background:#06100a;overflow:hidden;border:1px solid var(--line);margin-top:8px}
  .xp>i{display:block;height:100%;background:repeating-linear-gradient(90deg,#39ff14 0 8px,#2fd60f 8px 10px);
    box-shadow:0 0 10px #39ff1488;transition:width .6s}

  /* 预算条 */
  .bar{height:10px;border-radius:999px;background:#06100a;overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#2fd60f,#39ff14);border-radius:999px}
  .bar.warn>i{background:linear-gradient(90deg,#ffb020,#ffd23f)}
  .bar.bad>i{background:linear-gradient(90deg,#ff3b3b,#ff7a7a)}

  /* BOSS 血条 */
  .boss{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .boss:last-child{border-bottom:0}
  .boss-icon{width:44px;height:44px;flex:0 0 auto;image-rendering:pixelated}
  .hp{height:14px;border:2px solid #0f3d18;border-radius:4px;background:#050a06;overflow:hidden;margin-top:6px;padding:1px}
  .hp>i{display:block;height:100%;background:repeating-linear-gradient(90deg,#ff5a5a 0 6px,#d63a3a 6px 8px);border-radius:2px}
  .hp.dead>i{background:var(--neon)}

  /* 徽章 */
  .badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .badge{background:#070d08;border:1px solid var(--line);border-radius:18px;padding:10px 6px;text-align:center}
  .badge .ic{font-size:22px;filter:grayscale(1) opacity(.35)}
  .badge.on{border-color:#2fd60f;box-shadow:0 0 14px #39ff1433}
  .badge.on .ic{filter:none}
  .badge .t{font-size:11px;color:var(--dim);margin-top:4px}
  .badge.on .t{color:var(--mint)}

  /* 流水 */
  .item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
  .tag{font-size:12px;color:var(--dim)}
  .hidden{display:none !important}

  /* 一手操作的底部导航 */
  .dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
    width:min(440px,calc(100% - 28px));height:72px;border-radius:999px;
    background:rgba(12,22,14,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid #1f3d27;box-shadow:0 10px 40px #000a, 0 0 0 1px #000 inset;
    display:flex;align-items:center;justify-content:space-around;padding:0 10px;z-index:10}
  .dock button{background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;
    gap:3px;font-size:11px;padding:6px 10px;cursor:pointer;border-radius:18px;transition:color .2s,transform .15s}
  .dock button svg{width:24px;height:24px}
  .dock button.on{color:var(--neon)}
  .dock button:active{transform:scale(.92)}
  .dock button.fab{width:52px;height:52px;padding:0;gap:0;border-radius:50%;
    background:radial-gradient(circle at 30% 25%,#c6ff9e,#39ff14 45%,#1fa80a);
    color:#001a00;display:flex;align-items:center;justify-content:center;margin-top:-20px;
    box-shadow:0 0 0 5px #000, 0 0 20px #39ff1488;font-size:28px;font-weight:300;line-height:1}
  .dock button.fab.on{color:#001a00}

  /* 记一笔：分段切换 + 潮流键盘 */
  .seg{display:grid;grid-template-columns:repeat(4,1fr);background:#06100a;border:1px solid var(--line);
    border-radius:999px;padding:4px;position:relative}
  .seg button{position:relative;z-index:1;background:none;border:0;color:var(--dim);padding:10px 0;font-size:14px;
    cursor:pointer;border-radius:999px;transition:color .2s}
  .seg button.on{color:#001a00;font-weight:800}
  .seg .thumb{position:absolute;top:4px;bottom:4px;width:calc(25% - 4px);left:4px;border-radius:999px;
    background:linear-gradient(180deg,#5dff3a,#2fd60f);box-shadow:0 0 16px #39ff1466;transition:left .3s cubic-bezier(.2,.9,.3,1.2)}
  .amountbox{text-align:center;padding:18px 0 10px}
  .amountbox .cur{font-size:14px;color:var(--dim);letter-spacing:2px}
  .amount{font-size:52px;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(180deg,#eafff0,#7dff8e);-webkit-background-clip:text;background-clip:text;color:transparent;
    min-height:62px;line-height:1.15}
  .caret{display:inline-block;width:3px;height:40px;background:var(--neon);vertical-align:middle;margin-left:4px;
    animation:blink 1s steps(2,start) infinite;border-radius:2px}
  @keyframes blink{to{visibility:hidden}}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
  .key{height:70px;border-radius:24px;background:linear-gradient(180deg,#152419,#0a130c);border:1px solid #1f3a27;
    color:var(--text);font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;transition:transform .08s, box-shadow .15s, background .15s;
    box-shadow:0 4px 0 #050a06, inset 0 1px 0 #ffffff10}
  .key:active{transform:translateY(3px);box-shadow:0 1px 0 #050a06;background:#1a3a20;color:var(--neon)}
  .key.ok{background:linear-gradient(180deg,#5dff3a,#2fd60f);color:#001a00;border-color:transparent;
    box-shadow:0 4px 0 #1a7a08, 0 0 22px #39ff1455}
  .key.ok:active{box-shadow:0 1px 0 #1a7a08}
  .key svg{width:28px;height:28px}
  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(10px);background:var(--neon);color:#000;
    padding:10px 18px;border-radius:999px;font-weight:800;opacity:0;transition:all .3s;pointer-events:none;z-index:20;
    box-shadow:0 0 24px #39ff1488;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .spark{position:fixed;font-family:var(--pixel);font-size:12px;color:var(--neon);pointer-events:none;z-index:30;
    animation:float 1s ease-out forwards}
  @keyframes float{to{transform:translateY(-70px);opacity:0}}
  /* ===== 第二版视觉：统一圆角、玻璃卡片、层次绿 ===== */
  :root{
    --r-xl:28px; --r-l:22px; --r-m:16px;
    --glass:rgba(14,26,17,.72);
    --edge:rgba(57,255,20,.14);
    --glow:0 0 0 1px var(--edge), 0 12px 40px rgba(0,0,0,.6);
  }
  body{
    background:
      radial-gradient(90% 45% at 50% -8%, rgba(57,255,20,.18), transparent 70%),
      radial-gradient(60% 30% at 100% 100%, rgba(15,90,36,.25), transparent 70%),
      #000;
    background-attachment:fixed;
    padding-bottom:140px;
  }
  body::before{ /* 很淡的像素网格，只做质感 */
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.05;
    background-image:linear-gradient(#39ff14 1px,transparent 1px),linear-gradient(90deg,#39ff14 1px,transparent 1px);
    background-size:22px 22px; z-index:0;
  }
  body>*{position:relative;z-index:1}
  h1{font-size:15px;letter-spacing:.5px;color:var(--mint);margin:10px 2px 16px;font-family:var(--pixel)}
  h1::after{content:"";display:block;width:36px;height:3px;border-radius:3px;margin-top:10px;
    background:linear-gradient(90deg,var(--neon),transparent)}

  .card{background:var(--glass);border:0;border-radius:var(--r-xl);padding:18px;margin-bottom:14px;
    box-shadow:var(--glow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    transition:transform .2s ease, box-shadow .2s ease}
  .card:hover{box-shadow:0 0 0 1px rgba(57,255,20,.28), 0 16px 48px rgba(0,0,0,.7)}

  /* 首页头部卡片 */
  #page-home>.card:first-of-type{padding:20px}
  .alien{width:112px;height:112px;border-radius:32px;padding:10px;
    background:radial-gradient(circle at 50% 35%,rgba(57,255,20,.28),rgba(15,90,36,.15) 65%,transparent 75%);
    filter:none}
  .bubble{background:rgba(57,255,20,.07);border:1px solid rgba(57,255,20,.18);border-radius:var(--r-l);
    color:var(--mint);font-size:15px;line-height:1.5}
  .bubble:before{background:transparent;border:0;display:none}
  .xp{height:10px;border:0;background:rgba(57,255,20,.08);border-radius:999px}
  .xp>i{border-radius:999px}
  .muted{color:rgba(190,255,200,.55)}
  .big{font-size:38px;letter-spacing:-.5px}
  .bar{height:8px;background:rgba(57,255,20,.08)}
  .bar>i{background:linear-gradient(90deg,#1fa80a,#39ff14);box-shadow:0 0 12px rgba(57,255,20,.5)}

  /* BOSS 与徽章 */
  .boss{border-bottom:0;padding:12px 0}
  .boss-icon{width:46px;height:46px;border-radius:14px;background:rgba(255,90,90,.08);padding:6px}
  .hp{height:10px;border-radius:999px;border:0;background:rgba(255,90,90,.12)}
  .hp>i{border-radius:999px}
  .hp.dead{background:rgba(57,255,20,.12)}
  .badges{gap:10px}
  .badge{border:0;border-radius:var(--r-l);background:rgba(57,255,20,.05);padding:14px 6px}
  .badge.on{background:linear-gradient(180deg,rgba(57,255,20,.18),rgba(15,90,36,.2));box-shadow:0 0 18px rgba(57,255,20,.22)}
  .badge .ic{font-size:24px}

  /* 流水列表 */
  .item{border-bottom:1px solid rgba(57,255,20,.08);padding:14px 0}
  .item:last-child{border-bottom:0}

  /* 按钮与胶囊 */
  .pill{border:0;background:rgba(57,255,20,.07);color:var(--text);border-radius:999px;padding:10px 16px;
    transition:transform .15s ease, background .2s, box-shadow .2s}
  .pill:hover{background:rgba(57,255,20,.14)}
  .pill.on{background:linear-gradient(180deg,#6dff45,#2fd60f);color:#001a00;font-weight:800;
    box-shadow:0 0 22px rgba(57,255,20,.45), inset 0 1px 0 rgba(255,255,255,.4)}
  .btn{border-radius:999px;padding:16px;letter-spacing:.3px;transition:transform .15s, box-shadow .2s}
  .btn:hover{box-shadow:0 8px 30px rgba(57,255,20,.45)}
  input{background:rgba(0,0,0,.5);border:1px solid rgba(57,255,20,.12);border-radius:var(--r-m);padding:14px 16px}
  input:focus{border-color:rgba(57,255,20,.6);box-shadow:0 0 0 4px rgba(57,255,20,.12)}

  /* 底部导航：悬浮玻璃胶囊，大拇指好按 */
  .dock{height:68px;width:min(420px,calc(100% - 32px));background:rgba(8,16,10,.78);
    border:1px solid rgba(57,255,20,.16);box-shadow:0 14px 50px rgba(0,0,0,.8), 0 0 40px rgba(57,255,20,.08);
    padding:0 14px}
  .dock button{color:rgba(190,255,200,.5);font-size:11px;gap:4px;padding:8px 14px;border-radius:22px;
    transition:color .2s, background .25s, transform .15s}
  .dock button svg{width:22px;height:22px}
  .dock button:hover{color:var(--mint)}
  .dock button.on{color:var(--neon);background:rgba(57,255,20,.1)}
  .dock button.on svg{filter:drop-shadow(0 0 6px rgba(57,255,20,.7))}
  .dock button.fab{padding:0;background:none}
  .dock button.fab:hover{background:none}
  .dock button.fab{width:56px;height:56px;border-radius:50%;margin-top:-22px;
    background:radial-gradient(circle at 32% 26%,#eaffd8,#39ff14 42%,#17900a 100%);
    color:#001a00;font-size:30px;font-weight:400;
    box-shadow:0 0 0 5px rgba(0,0,0,.9), 0 0 24px rgba(57,255,20,.55)}
  .dock button.fab:active{transform:scale(.92)}

  /* 记一笔：更潮的键盘 */
  .seg{background:rgba(0,0,0,.45);border:0;border-radius:999px;padding:5px}
  .seg .thumb{border-radius:999px;box-shadow:0 0 18px rgba(57,255,20,.45)}
  .seg button{font-size:15px;font-weight:600;padding:11px 0}
  .amountbox{padding:22px 0 14px}
  .amountbox .cur{font-size:13px;color:rgba(190,255,200,.5);letter-spacing:3px}
  .amount{font-size:58px;font-weight:700;letter-spacing:-1.5px}
  .caret{width:3px;height:44px;border-radius:3px}
  .pad{gap:12px 14px}
  .key{height:72px;border-radius:50%;width:72px;justify-self:center;border:0;
    background:radial-gradient(circle at 50% 30%,rgba(57,255,20,.12),rgba(255,255,255,.02) 70%);
    box-shadow:inset 0 0 0 1px rgba(57,255,20,.1);font-size:26px;font-weight:500;color:#eafff0}
  .key:hover{background:radial-gradient(circle at 50% 30%,rgba(57,255,20,.22),rgba(255,255,255,.03) 70%)}
  .key:active{transform:scale(.92);background:rgba(57,255,20,.3);color:#001a00;
    box-shadow:0 0 22px rgba(57,255,20,.6)}
  .key svg{color:var(--mint)}
  .key.ok{width:auto;border-radius:999px;height:72px}
  .pad{grid-template-columns:repeat(3,1fr)}

  .toast{border-radius:999px;background:linear-gradient(180deg,#6dff45,#2fd60f);font-size:14px}
  .spark{font-size:11px;text-shadow:0 0 10px rgba(57,255,20,.8)}

  /* Alien 生动起来：眨眼、心情晃动 */
  .alien svg .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)} 96%{transform:scaleY(.12)}}
  .alien.happy{animation:bob 1.5s ease-in-out infinite}
  .alien.tense{animation:shake .45s ease-in-out infinite}
  .alien.dizzy{animation:wobble 1.6s ease-in-out infinite}
  @keyframes shake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)}}
  @keyframes wobble{0%,100%{transform:rotate(-7deg)} 50%{transform:rotate(7deg)}}

  /* 天文背景层 */
  #space{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .planet{position:absolute;image-rendering:pixelated;opacity:.55;animation:drift 14s ease-in-out infinite}
  .p-sun{width:110px;height:110px;top:-18px;right:-22px;opacity:.5;animation-duration:18s}
  .p-saturn{width:92px;height:92px;top:38%;left:-30px;opacity:.35;animation-duration:22s}
  .p-mars{width:46px;height:46px;top:16%;left:8%;opacity:.4;animation-duration:12s}
  .p-earth{width:84px;height:84px;bottom:110px;right:-18px;opacity:.45;animation-duration:20s}
  .p-moon{width:34px;height:34px;bottom:190px;right:58px;opacity:.5;animation-duration:9s}
  @keyframes drift{0%,100%{transform:translate(0,0)} 50%{transform:translate(6px,-10px)}}
  .star{position:absolute;width:2px;height:2px;background:#eafff0;border-radius:1px;opacity:.2;animation:twinkle 3.5s ease-in-out infinite}
  .star:nth-child(3n){width:3px;height:3px;background:#b6ffc0}
  @keyframes twinkle{50%{opacity:.85}}

  /* 记账后的场景弹窗 */
  .scene{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:opacity .25s}
  .scene.show{opacity:1;pointer-events:auto}
  .scene-card{width:min(340px,90vw);padding:16px 14px 18px;border-radius:32px;text-align:center;
    background:linear-gradient(180deg,rgba(20,38,24,.94),rgba(8,16,10,.94));
    border:1px solid rgba(57,255,20,.25);box-shadow:0 0 60px rgba(57,255,20,.2)}
  .scene.show .scene-card{animation:popIn .4s cubic-bezier(.2,1.5,.4,1)}
  @keyframes popIn{from{transform:scale(.7);opacity:0} to{transform:scale(1);opacity:1}}
  .stage{position:relative;height:210px;overflow:hidden;border-radius:24px;
    background:
      radial-gradient(1.5px 1.5px at 12% 20%, #eafff0 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 38% 12%, #b6ffc0 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 66% 30%, #eafff0 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 88% 14%, #b6ffc0 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 24% 44%, #eafff0 50%, transparent 51%),
      linear-gradient(180deg,#061009 0%,#0b1d10 100%)}
  .stage .ground{position:absolute;left:0;right:0;bottom:6px;height:3px;
    background:repeating-linear-gradient(90deg,rgba(57,255,20,.4) 0 12px,transparent 12px 22px)}
  .stage-moon{position:absolute;right:14px;top:10px;width:38px;height:38px;opacity:.85}
  .actor,.thing,.floaty,.beam,.hpmini{position:absolute;left:0;top:0;will-change:transform}
  .actor{width:76px;height:118px;z-index:3}
  .actor .sprite{width:100%;height:100%}
  .actor .hold{position:absolute;left:50px;top:62px;font-size:26px;transition:top .2s,left .2s}
  .actor.lift .hold{left:24px;top:-22px}
  .thing{font-size:44px;line-height:1;z-index:2}
  .thing.coin{font-size:24px}
  .thing.tag{font-size:12px;font-weight:800;color:#ff9a9a;letter-spacing:.5px}
  .bus{width:150px;height:84px;font-size:0}
  .bus .win{position:absolute;left:12px;top:12px;width:48px;height:32px;overflow:hidden;border-radius:4px}
  .bus .win .mini{position:absolute;left:7px;top:-1px;width:34px;height:53px;opacity:0;transition:opacity .2s}
  .bus.rumble svg{animation:rum .1s linear infinite}
  @keyframes rum{50%{transform:translateY(1px)}}
  .puff{font-size:22px;animation:puff .8s ease-out forwards}
  @keyframes puff{to{opacity:0;margin-top:-10px;margin-left:-24px}}
  .beam{height:5px;border-radius:5px;background:#39ff14;transform-origin:left center;z-index:4;
    box-shadow:0 0 12px #39ff14,0 0 26px #39ff14}
  .hpmini{height:7px;border-radius:7px;background:rgba(255,90,90,.2);overflow:hidden}

    text-shadow:0 0 10px rgba(57,255,20,.8);animation:up 1.3s ease-out forwards}

  #sText{font-size:14px;color:rgba(190,255,200,.7);margin-top:6px}

  /* 首页：主角 + 伴侣并排 */
  .alien{width:132px;height:118px;padding:6px 4px 2px}
  .duo{display:flex;align-items:flex-end;justify-content:center;height:100%}

  .alien.act-cheer{animation:cheer .9s ease-out}
  @keyframes cheer{0%{transform:translateY(0) rotate(0)} 30%{transform:translateY(-24px) rotate(-8deg)} 60%{transform:translateY(-24px) rotate(8deg)} 100%{transform:translateY(0) rotate(0)}}
  .alien.act-zap{animation:zap .6s}
  @keyframes zap{0%,100%{filter:none} 20%,60%{filter:brightness(2.2) drop-shadow(0 0 14px #ff5a5a)} 40%{filter:brightness(1.3) drop-shadow(0 0 6px #39ff14)}}
  .alien.act-hug{animation:hug .8s}

  .alien.act-poke{animation:poke .5s}

  @media (prefers-reduced-motion: reduce){

<script>
/* ===== 固定设定（不含密码）===== */
const CATS = {
  '支出': ['餐饮','交通','生活用品','衣服','娱乐','其他','房租','水电','保险','电话网络','还债'],
  '收入': ['工资','兼职','其他收入'],
};
const DAILY_BUDGET = { '餐饮':420, '交通':100, '生活用品':100, '娱乐':40, '其他':25 };
const DAILY_CATS = Object.keys(DAILY_BUDGET);
const PAYS = ['现金','Maybank','HLB','TNG'];
const DEBTS = ['Brother','Church','Stewart'];
const DEBT_START = { Brother:17500, Church:1750, Stewart:3500 };   // 2026/11 起点
const BUDGET_START_DAY = 7;

/* ===== 本机存储 ===== */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let cfg = store.get('cfg', {url:'', pin:''});
let records = store.get('records', []);
let queue = store.get('queue', []);

/* ===== 工具 ===== */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const today = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const money = n => 'RM ' + Number(n||0).toFixed(2);
function buzz(ms=8){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

/* 音效：用程序合成，不需要音效文件，离线也能响 */
const sfx = {
  ctx: null,
  on: store.get('sound', true),
  get ac(){
    if (!this.ctx){ try{ this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(f, t0, dur, type='sine', vol=0.15, slide=0){
    const ac = this.ac; if (!ac || !this.on) return;
    const now = ac.currentTime + t0;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, now);
    if (slide) o.frequency.exponentialRampToValueAtTime(f*slide, now+dur);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(vol, now+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    o.connect(g).connect(ac.destination);
    o.start(now); o.stop(now+dur+0.02);
  },
  tick(){ this.tone(1500, 0, 0.035, 'square', 0.025); },
  pop(){ this.tone(520, 0, 0.09, 'square', 0.06, 2.2); },
  success(){ [660, 880, 1320].forEach((f,i) => this.tone(f, i*0.07, 0.16, 'square', 0.06)); },
  levelup(){ [523, 659, 784, 1046].forEach((f,i) => this.tone(f, i*0.09, 0.22, 'square', 0.06)); },
  error(){ this.tone(220, 0, 0.24, 'sawtooth', 0.07, 0.6); },
};
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

/* 预算月：每月 7 号开始 */
function budgetMonthStart(){
  const d = new Date(); const y=d.getFullYear(), m=d.getMonth();
  const start = new Date(y, m, BUDGET_START_DAY);
  return d < start ? new Date(y, m-1, BUDGET_START_DAY) : start;
}
function inBudgetMonth(dateStr){
  const s = budgetMonthStart(); const d = new Date(dateStr+'T00:00:00');
  const e = new Date(s.getFullYear(), s.getMonth()+1, BUDGET_START_DAY);
  return d >= s && d < e;
}

/* ===== 像素角色：主角（呆呆的外星人帽女生）+ 伴侣（粉色发箍、笑眯眯）===== */
const ALIEN_W = 20;
const ALIEN_BASE = [
  ".kkkk.........kkkk..",  // 0  触角眼球
  ".kwwk.........kwwk..",  // 1
  ".kwok.........kowk..",  // 2
  ".kkkk.........kkkk..",  // 3
  "..k............k....",  // 4  触角杆
  "..kGG..........k....",  // 5  绿色弹簧
  "..GGk..........k....",  // 6
  "...kGG.........k....",  // 7
  "....kkkkkkkkkkkk....",  // 8  帽顶
  "...kkkkkLLLLkkkkk...",  // 9  唇形徽章
  "...kkkkLwwwwLkkkk...",  // 10
  "...kkkkkLLLLkkkkk...",  // 11
  "kkkkkkkkkkkkkkkkk...",  // 12 帽檐
  "...ggggggggggggg....",  // 13 脸
  "..ggggggggggggggg...",  // 14
  "..ggggggggggggggg...",  // 15 眼睛行
  "..ggggggggggggggg...",  // 16
  "..ggggggggggggggg...",  // 17
  "...gggggggggggggg...",  // 18 嘴
  "....gggggggggggg....",  // 19
  ".....gggggggggg.....",  // 20
  "......gggggggg......",  // 21 下巴
  "......bbtttbbb......",  // 22 衣领 + 黑蝴蝶结
  "....bbbbbtbbbbb.....",  // 23 浅蓝衬衫
  "....gbbbbtbbbbg.....",  // 24 手
  ".....bbbbtbbbb......",  // 25
  ".....sssssssss......",  // 26 黑色百褶裙
  "....sssssssssss.....",  // 27
  "......g.....g.......",  // 28 腿
  "......n.....n.......",  // 29 白袜
  ".....zz.....zz......",  // 30 球鞋
];
// 伴侣：没有外星帽，换成粉色发箍 + 棕红长发
const PARTNER_TOP = [
  "....................",
  "....................",
  "....................",
  "....................",
  "....................",
  "....................",
  "....................",
  "......hhhhhhhh......",  // 7  头顶
  "....hhhhhhhhhhhh....",  // 8
  "...hPPPPPPPPPPPPh...",  // 9  粉色发箍
  "...hhhhhhhhhhhhhh...",  // 10
  "..hhhhhhhhhhhhhhhh..",  // 11
  "..hhhhgggggggghhhh..",  // 12 额头（中分）
];
const PX = {
  k:'#0b0b0b', w:'#ffffff', o:'#0b0b0b', G:'#9cff3a', L:'#39ff14',
  g:'#f6d5c0', e:'#24160f', m:'#b8485e', r:'#ff7a95', R:'#7a1f33',
  b:'#a9c8ee', t:'#111111', s:'#151515', n:'#eeeeee', z:'#8d939a',
  x:'#ffd23f', S:'#6fd6ff', h:'#2a1a12', p:'#ffb0bf', P:'#ffc2cf'
};
const PX_PARTNER = Object.assign({}, PX, { h:'#7a4a2e' });

function alienSprite(o = {}){
  const who = o.who || 'main';
  const rowsSrc = who==='partner' ? PARTNER_TOP.concat(ALIEN_BASE.slice(13)) : ALIEN_BASE;
  const pal = who==='partner' ? PX_PARTNER : PX;
  const R = rowsSrc.map(r => r.padEnd(ALIEN_W,'.').slice(0,ALIEN_W).split(''));
  const set = (y,x,c) => { if (R[y] && x>=0 && x<ALIEN_W) R[y][x] = c; };
  const eyes = o.eyes || 'dot', mouth = o.mouth || 'flat', legs = o.legs || 'stand', arms = o.arms || 'down';

  // 长直发：中分，脸两侧垂下来把脸框住，一直到腰
  if (who==='main'){ set(13,3,'h'); set(13,4,'h'); set(13,14,'h'); set(13,15,'h'); }
  for (let y=13; y<=27; y++) for (let x=1; x<=17; x++){
    const side = x<=2 || x>=16 || (y>=19 && (x<=3 || x>=15));
    if (side && R[y][x]==='.') R[y][x] = 'h';
  }
  for (let y=14; y<=19; y++){ set(y,2,'h'); set(y,3,'h'); set(y,15,'h'); set(y,16,'h'); }

  // 腮红
  set(17,4,'p'); set(17,14,'p');
  if (who==='partner'){ set(17,5,'p'); set(17,13,'p'); }

  // 眼睛：圆豆眼（呆）、往上看（放空）、斜眼、笑眯眯、闭眼、晕
  const L = [5,6], Rr = [12,13];
  if (eyes==='up'){            // 黑眼珠在上，下面露白 → 发呆往上看
    [...L,...Rr].forEach(x => { set(15,x,'e'); set(16,x,'w'); });
  } else if (eyes==='side'){   // 斜眼看旁边
    [L[0],Rr[0]].forEach(x => { set(15,x,'w'); set(16,x,'w'); });
    [L[1],Rr[1]].forEach(x => { set(15,x,'e'); set(16,x,'e'); });
  } else if (eyes==='happy'){  // 笑眯眯 ∩∩
    set(15,5,'e'); set(15,6,'e'); set(16,4,'e'); set(16,7,'e');
    set(15,12,'e'); set(15,13,'e'); set(16,11,'e'); set(16,14,'e');
  } else if (eyes==='stern'){   // Luna 皱眉瞪人
    [...L,...Rr].forEach(x => { set(15,x,'e'); set(16,x,'e'); });
    set(13,5,'e'); set(14,6,'e'); set(13,13,'e'); set(14,12,'e');
  } else if (eyes==='closed'){
    [5,6,12,13].forEach(x => set(16,x,'e'));
  } else if (eyes==='x'){
    set(15,5,'x'); set(16,6,'x'); set(15,13,'x'); set(16,12,'x');
  } else {                     // dot：圆豆眼 + 一点高光
    [...L,...Rr].forEach(x => { set(15,x,'e'); set(16,x,'e'); });
    set(15,6,'w'); set(15,13,'w');
  }

  // 嘴：一字小嘴（呆）、小微笑、嘟嘴、小 O、大张嘴、吐舌头
  const M = {
    flat:  [[18,9,'m'],[18,10,'m']],
    smile: [[18,8,'m'],[18,11,'m'],[19,9,'m'],[19,10,'m']],
    pout:  [[18,9,'r'],[18,10,'r'],[19,9,'m'],[19,10,'m']],
    open:  [[17,9,'m'],[17,10,'m'],[18,8,'m'],[18,9,'r'],[18,10,'r'],[18,11,'m'],[19,9,'m'],[19,10,'m']],
    wide:  [[17,7,'m'],[17,8,'m'],[17,9,'m'],[17,10,'m'],[17,11,'m'],[17,12,'m'],
            [18,7,'m'],[18,8,'R'],[18,9,'R'],[18,10,'R'],[18,11,'R'],[18,12,'m'],
            [19,7,'m'],[19,8,'r'],[19,9,'r'],[19,10,'r'],[19,11,'r'],[19,12,'m'],
            [20,8,'m'],[20,9,'m'],[20,10,'m'],[20,11,'m']],
    tongue:[[18,8,'m'],[18,9,'m'],[18,10,'m'],[18,11,'m'],[19,10,'r'],[19,11,'r']],
  };
  (M[mouth] || M.flat).forEach(([y,x,c]) => set(y,x,c));

  // 走路
  if (legs !== 'stand'){
    for (const y of [28,29,30]) for (let x=0; x<ALIEN_W; x++) R[y][x]='.';
    const a = legs==='walk1' ? 5 : 6, b = legs==='walk1' ? 12 : 13;
    set(28,a,'g'); set(29,a,'n'); set(30,a-1,'z'); set(30,a,'z');
    set(28,b,'g'); set(29,b,'n'); set(30,b,'z'); set(30,b+1,'z');
  }
  // 举手
  if (arms==='up'){ set(24,4,'b'); set(24,14,'b'); set(23,3,'g'); set(23,15,'g'); set(22,3,'g'); set(22,15,'g'); }
  if (o.sweat){ set(13,16,'S'); set(14,16,'S'); }

  let base = '', eyeG = '';
  R.forEach((row,y) => row.forEach((c,x) => {
    if (c==='.') return;
    const r = `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${pal[c]||'#000'}"/>`;
    if ((y===15||y===16) && (c==='e'||c==='w') && x>=4 && x<=14) eyeG += r; else base += r;
  }));
  return `<svg viewBox="0 0 ${ALIEN_W} ${R.length}" shape-rendering="crispEdges" width="100%" height="100%">${base}<g class="eyes">${eyeG}</g></svg>`;
}

/* 首页：主角 + 伴侣并排。主角呆呆的，伴侣笑眯眯 */
function alienSVG(mood, look){
  let me, her;
  if (mood==='dizzy'){ me = {eyes:'x', mouth:'open'};              her = {who:'partner', eyes:'stern', mouth:'open'}; }
  else if (mood==='tense'){ me = {eyes:'side', mouth:'pout', sweat:true}; her = {who:'partner', eyes:'stern', mouth:'pout'}; }

/* ===== 天文背景：像素太阳、地球、月球、火星、土星 + 星星 ===== */
function planetSVG(type){
  const N = 16, c = (N-1)/2, rad = 7.2;
  let rects = '';
  const put = (x,y,col) => { rects += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${col}"/>`; };
  if (type==='saturn'){   // 土星环（先画后半圈）
    for (let x=0; x<N+6; x++){ const y = Math.round(9 + (x-(N+6)/2)*0.18); put(x-3+0, y, '#c9a25a'); }
  }
  for (let y=0; y<N; y++) for (let x=0; x<N; x++){
    const dx=x-c, dy=y-c, d=Math.sqrt(dx*dx+dy*dy);
    if (d>rad) continue;
    const n = (x*7 + y*13 + x*y) % 11;          // 固定的“花纹”
    const shade = dx+dy > 4;                     // 右下暗面
    let col;
    if (type==='sun')   col = d>rad-1.2 ? '#ff9f1c' : (n<3 ? '#ffe066' : '#ffd23f');
    if (type==='earth') col = (n<4 || (x>5&&x<9&&y>3&&y<8) || (x>8&&y>9&&x<13)) ? (shade?'#1fa80a':'#39ff14') : (shade?'#1d4fa0':'#2f7de1');
    if (type==='moon')  col = (n===2||n===7) ? '#9aa0a6' : (shade?'#b9bec4':'#dde1e5');
    if (type==='mars')  col = n<3 ? '#a8381c' : (shade?'#c4491f':'#e8662f');
    if (type==='saturn')col = (y%3===0) ? '#d9b46a' : (shade?'#c29a52':'#ecd08f');
    put(x,y,col);
  }
  if (type==='saturn'){   // 土星环前半圈
    for (let x=0; x<N+6; x++){ const y = Math.round(9 + (x-(N+6)/2)*0.18); if (x<4||x>N+1) put(x-3, y, '#e8c87a'); }
  }
  if (type==='sun'){      // 太阳光芒
    [[7,-3],[8,-3],[7,N+2],[8,N+2],[-3,7],[-3,8],[N+2,7],[N+2,8],[-1,-1],[N,-1],[-1,N],[N,N]]
      .forEach(([x,y]) => put(x,y,'#ffd23f'));
  }
  return `<svg viewBox="-4 -4 ${N+8} ${N+8}" shape-rendering="crispEdges" width="100%" height="100%">${rects}</svg>`;
}
(function buildSpace(){
  const sp = document.createElement('div'); sp.id = 'space'; sp.setAttribute('aria-hidden','true');
  const planets = [
    {t:'sun',    cls:'p-sun'},
    {t:'saturn', cls:'p-saturn'},
    {t:'mars',   cls:'p-mars'},
    {t:'earth',  cls:'p-earth'},
    {t:'moon',   cls:'p-moon'},
  ];
  sp.innerHTML = planets.map(p => `<div class="planet ${p.cls}">${planetSVG(p.t)}</div>`).join('')
    + Array.from({length:36}, (_,i) => {
        const x = (i*37 % 100), y = (i*61 % 100), d = (i%5)*0.7;
        return `<i class="star" style="left:${x}%;top:${y}%;animation-delay:${d}s"></i>`;
      }).join('');
  document.body.prepend(sp);
})();

  else { pose(her, {mouth:'smile'}); heart(px+AW/2, y+10); }
  await hop(a, x, y); pose(a, {mouth:'pout', eyes:'dot'});
}

async function runScene(rec){
  const run = ++sceneRun;
  const st = $('#stage');
  st.innerHTML = `<div class="ground"></div><div class="stage-moon">${planetSVG('moon')}</div>`;
  $('#scene').classList.add('show');
  const W = st.clientWidth || 300;
  const key = rec.type==='还债' ? '还债' : rec.type==='收入' ? '收入' : rec.type==='转存' ? '转存' : rec.category;
  const m = SCENE_MAP[key] || SCENE_MAP['其他'];
  const fill = s => s.replace('{amt}', money(rec.amount)).replace('{debt}', rec.debtTo||'').replace('{note}', rec.note||'某个地方');
  $('#sTitle').textContent = fill(m.title);
  $('#sText').textContent = fill(m.text);
  try{
    if (m.kind==='eat')        await sceneEat(rec, run, W);
    else if (m.kind==='ride')  await sceneRide(rec, run, W);
    else if (m.kind==='cheer') await sceneCheer(rec, run, W);
    else if (m.kind==='zap')   await sceneZap(rec, run, W);
    else if (m.kind==='save')  await sceneSave(rec, run, W);
    else                       await sceneCarry(rec, run, W, m.prop);
  }catch(e){}
  if (!alive(run)) return;
  await sleep(1300);
  if (alive(run)) hideScene();
}
function showScene(rec){ runScene(rec); }
function hideScene(){ sceneRun++; $('#scene').classList.remove('show'); }
$('#scene').onclick = hideScene;

const POKE_LINES =['Aylin：……？','Aylin：嗯。','Luna：别戳她，让她去记账。','Luna：今天花了多少？老实说。','Aylin：（发呆中）'];

/* ===== 原创 8-bit 背景音乐《Aylin 的小宇宙》：方波旋律 + 三角波低音，循环播放 ===== */
const BGM_LEAD = [          // 原创旋律：温柔、慢一点
  76,0,0,79,0,0,76,74,   74,0,0,0,71,0,74,0,
  72,0,0,76,0,0,72,69,   69,0,0,0,0,0,67,69,
  72,0,0,76,0,79,0,0,    81,0,79,0,76,0,74,0,
  76,0,0,72,0,0,74,0,    72,0,0,0,0,0,0,0,
];
const BGM_BASS = [48,43,45,41,48,43,45,41];   // C - G - Am - F，每小节一个和弦
const BGM_SHIFT = -4;   // 移到 A♭ 大调（F 小调的关系大调），和 Tilt 同一个调性家族
const BGM_ARP = [[60,64,67,72],[55,59,62,67],[57,60,64,69],[53,57,60,65]];
const bgm = {
  on: store.get('music', true), timer: null, step: 0, next: 0,
  note(m, t, dur, type, vol){
    const ac = sfx.ctx; if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(440*Math.pow(2,(m+BGM_SHIFT-69)/12), t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
  },
  start(){
    if (!this.on || this.timer) return;
    const ac = sfx.ac; if (!ac) return;
    const s = 60/96/2;                  // 96 BPM，和 Tilt 同样的速度
    this.next = ac.currentTime + 0.1;
    this.timer = setInterval(() => {
      while (this.next < ac.currentTime + 0.25){
        const i = this.step, t = this.next;
        const bar = Math.floor(i/8);
        if (BGM_LEAD[i]) this.note(BGM_LEAD[i], t, s*2.4, 'square', 0.02);
        this.note(BGM_ARP[bar % 4][i % 4], t, s*0.9, 'triangle', 0.018);      // 分解和弦
        if (i % 4 === 0) this.note(BGM_BASS[bar], t, s*3.6, 'triangle', 0.05);
        this.next += s; this.step = (this.step + 1) % BGM_LEAD.length;
      }
    }, 60);
  },
  stop(){ clearInterval(this.timer); this.timer = null; },
};
/* 浏览器要求先点一下才能出声：第一次点屏幕就开始播放 */
document.addEventListener('pointerdown', () => bgm.start());
document.addEventListener('visibilitychange', () => { if (document.hidden) bgm.stop(); });
function paintMusBtn(){ $('#musToggle').textContent = '背景音乐：' + (bgm.on ? '开' : '关'); }
paintMusBtn();
$('#musToggle').onclick = () => { bgm.on = !bgm.on; store.set('music', bgm.on); paintMusBtn(); bgm.on ? bgm.start() : bgm.stop(); };

/* ===== 页面切换 ===== */
const PAGES = ['home','add','log','cfg'];
function go(page){
  curPage = page;
  PAGES.forEach(p => { const el=$('#page-'+p); if(el) el.classList.toggle('hidden', p!==page); });
  document.querySelectorAll('.dock [data-go]').forEach(b => b.classList.toggle('on', b.dataset.go===page));
  if (page==='home') renderHome();
  if (page==='log') renderLog();
  buzz(5); sfx.pop();
}
document.querySelectorAll('.dock [data-go]').forEach(b => b.onclick = () => go(b.dataset.go));

/* ===== 首次设定 ===== */
function needSetup(){ return !cfg.url || !cfg.pin; }
function showSetup(show){
  $('#setup').classList.toggle('hidden', !show);
  $('#dock').classList.toggle('hidden', show);
  PAGES.forEach(p => { const el=$('#page-'+p); if(el) el.classList.toggle('hidden', show || p!==(curPage||'home')); });
}
let curPage = 'home';
function openCfg(){ $('#cfgUrl').value=cfg.url; $('#cfgPin').value=cfg.pin; showSetup(true); }
$('#cfgOpen2').onclick = openCfg;
function paintSndBtn(){ $('#sndToggle').textContent = '音效：' + (sfx.on ? '开' : '关'); }
paintSndBtn();
$('#sndToggle').onclick = () => {
  sfx.on = !sfx.on; store.set('sound', sfx.on); paintSndBtn();
  if (sfx.on) sfx.success();
};
$('#cfgSave').onclick = () => {
  const url = $('#cfgUrl').value.trim(), pin = $('#cfgPin').value.trim();
  if (!/^https:\/\/script\.google\.com\//.test(url)) return toast('网址不对');
  if (!/^\d{6}$/.test(pin)) return toast('PIN 要 6 位数字');
  cfg = {url, pin}; store.set('cfg', cfg);
  showSetup(false); go('home'); flush();

/* ===== 记账状态 ===== */
let state = { type:'支出', cat:'餐饮', pay: store.get('lastPay','HLB'), debt:'Brother', amount:'' };
const TYPES = ['支出','收入','还债','转存'];

function buildPills(){
  const list = state.type==='收入' ? CATS['收入'] : CATS['支出'];
  $('#catPills').innerHTML = list.map(c =>
    `<span class="pill ${c===state.cat?'on':''}" data-cat="${c}">${c}</span>`).join('');
  $('#debtBox').classList.toggle('hidden', state.type!=='还债');
  $('#debtPills').innerHTML = DEBTS.map(d =>
    `<span class="pill ${d===state.debt?'on':''}" data-debt="${d}">${d}</span>`).join('');
  $('#payPills').innerHTML = PAYS.map(p =>
    `<span class="pill ${p===state.pay?'on':''}" data-pay="${p}">${p}</span>`).join('');
  $('#amtShow').textContent = state.amount || '0.00';
  // 分段滑块位置
  const i = TYPES.indexOf(state.type);
  const thumb = document.querySelector('#typeSeg .thumb');
  thumb.style.left = `calc(${i*25}% + 4px)`;
  document.querySelectorAll('#typeSeg button').forEach((b,j)=>b.classList.toggle('on', j===i));
}
document.querySelectorAll('#typeSeg button').forEach(b => b.onclick = () => {
  state.type = b.dataset.type; buzz();
  if (state.type==='收入') state.cat='工资';
  else if (state.type==='还债') state.cat='还债';
  else if (state.type==='转存') state.cat='备用金';
  else state.cat='餐饮';
  buildPills();
});
$('#catPills').onclick = e => { const c=e.target.dataset.cat; if(c){ state.cat=c; buzz(); buildPills(); } };
$('#debtPills').onclick = e => { const d=e.target.dataset.debt; if(d){ state.debt=d; buzz(); buildPills(); } };
$('#payPills').onclick = e => { const p=e.target.dataset.pay; if(p){ state.pay=p; store.set('lastPay',p); buzz(); buildPills(); } };

/* 数字键盘：圆角按键 + 退格图标 + 保存键 */
const BACK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 6H9l-6 6 6 6h12a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1z"/><path d="M14 10l-4 4M10 10l4 4"/></svg>';
const KEYS = ['1','2','3','4','5','6','7','8','9','.','0','⌫'];
$('#keys').innerHTML = KEYS.map(k => `<div class="key" data-k="${k}">${k==='⌫'?BACK_SVG:k}</div>`).join('');
$('#keys').onclick = e => {
  const key = e.target.closest('.key'); if(!key) return;
  const k = key.dataset.k; buzz(6); sfx.tick();
  if (k==='⌫') state.amount = state.amount.slice(0,-1);
  else if (k==='.') { if(!state.amount.includes('.')) state.amount = (state.amount||'0')+'.'; }
  else {
    const dot = state.amount.indexOf('.');
    if (dot>=0 && state.amount.length-dot>2) return;
    if (state.amount.length>=9) return;
    state.amount = state.amount==='0' ? k : state.amount+k;
  }
  buildPills();
};

$('#date').value = today();

/* 保存一笔 */
$('#saveBtn').onclick = () => {
  const amount = parseFloat(state.amount);
  if (!amount || amount<=0) return toast('先输入金额');
  const rec = {
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    date: $('#date').value || today(),
    type: state.type, category: state.cat, amount,
    pay: state.pay,
    debtTo: state.type==='还债' ? state.debt : '',
    note: $('#note').value.trim(), by: '我', receipt: ''
  };
  records.unshift(rec); store.set('records', records);
  queue.push(rec.id); store.set('queue', queue);
  const xpGain = 10;
  state.amount=''; $('#note').value='';
  buildPills();
  sparkAt($('#saveBtn'), '+'+xpGain+' XP');
  toast('✓ 已记录' + (state.type==='支出' && DAILY_CATS.includes(rec.category) ? `，${rec.category}本月还剩 ${money(catLeft(rec.category))}` : ''));
  buzz(18); setTimeout(()=>{ showScene(rec); afterSaveFx(rec); }, 80);
  flush();
  go('home');
};
function sparkAt(el, text){
  const r = el.getBoundingClientRect();
  const s = document.createElement('div');
  s.className='spark'; s.textContent=text;
  s.style.left = (r.left + r.width/2 - 30)+'px'; s.style.top=(r.top-10)+'px';
  document.body.appendChild(s); setTimeout(()=>s.remove(), 1000);
}

/* ===== 计算 ===== */
function monthSpend(cat){
  return records.filter(r => r.type==='支出' && r.category===cat && inBudgetMonth(r.date))
    .reduce((s,r)=>s+r.amount,0);
}
function catLeft(cat){ return (DAILY_BUDGET[cat]||0) - monthSpend(cat); }
function debtPaid(name){
  return records.filter(r => r.type==='还债' && r.debtTo===name).reduce((s,r)=>s+r.amount,0);
}
function streakDays(){
  const days = new Set(records.map(r=>r.date));
  let d = new Date(); let n=0;
  if (!days.has(today())) d.setDate(d.getDate()-1);   // 今天还没记，从昨天算
  while (true){
    const k = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    if (!days.has(k)) break;
    n++; d.setDate(d.getDate()-1);
  }
  return n;
}

function renderHome(){
  // 预算
  const s = budgetMonthStart();
  $('#monthLabel').textContent = `预算月：${s.getMonth()+1}/${s.getDate()} 起`;
  const totalBudget = DAILY_CATS.reduce((a,c)=>a+DAILY_BUDGET[c],0);
  const totalSpent = DAILY_CATS.reduce((a,c)=>a+monthSpend(c),0);
  const totalLeft = totalBudget-totalSpent;
  $('#remain').textContent = money(totalLeft);
  $('#remain').style.color = totalLeft<0 ? 'var(--bad)' : 'var(--neon)';
  $('#catBars').innerHTML = DAILY_CATS.map(c => {
    const pct = Math.min(100, monthSpend(c)/DAILY_BUDGET[c]*100);
    const cls = pct>=100?'bad':pct>=80?'warn':'';
    return `<div style="margin-top:12px"><div class="row"><span>${c}</span><span class="muted">${money(catLeft(c))} 剩</span></div>
      <div class="bar ${cls}"><i style="width:${pct}%"></i></div></div>`;
  }).join('');

  // Alien 情绪与对话
  let mood='happy', say='今天也一起记账吧！';
  if (totalLeft<0){ mood='dizzy'; say='Luna：超支了！这个月不准再乱买！'; }
  else if (totalLeft < totalBudget*0.2){ mood='tense'; say='Luna：Aylin！钱快没了，别再乱花！'; }
  else if (records.length===0){ say='Luna：Aylin，花了钱就要记账，知道吗？'; }
  else { say='Luna：还在预算内。Aylin，继续保持。'; }
  $('#alienBox').innerHTML = alienSVG(mood);
  $('#alienBox').className = 'alien ' + mood; curMood = mood;
  $('#bubble').textContent = say;

  // 等级与连续天数
  const xp = records.length*10;
  const lv = Math.floor(xp/100)+1;
  const stage = lv>=5 ? '飞碟 Alien' : lv>=3 ? '加触角' : '幼体';
  $('#lvlTxt').textContent = 'LV '+lv;
  $('#stageTxt').textContent = stage;
  $('#xpBar').style.width = (xp%100)+'%';
  const streak = streakDays();
  $('#streak').textContent = streak;

  // BOSS 血条
  $('#bosses').innerHTML = DEBTS.map(name => {
    const start = DEBT_START[name];
    const left = Math.max(0, start - debtPaid(name));
    const pct = left/start*100;
    const dead = left<=0;
    return `<div class="boss" data-boss="${name}">
      <div class="boss-icon">${bossSVG(pct, dead)}</div>
      <div style="flex:1">
        <div class="row"><b>${name}</b><span class="muted">${dead?'已击败 ✓':money(left)}</span></div>
        <div class="hp ${dead?'dead':''}"><i style="width:${pct}%"></i></div>
      </div></div>`;
  }).join('');

  // 成就
  const monthOk = DAILY_CATS.every(c => monthSpend(c) <= DAILY_BUDGET[c]) && records.some(r=>inBudgetMonth(r.date));
  const badges = [
    {ic:'🔥', t:'连续 7 天', on: streak>=7},
    {ic:'🛡️', t:'本月没超支', on: monthOk},
    {ic:'🏆', t:'Church 击败', on: debtPaid('Church')>=DEBT_START.Church},
    {ic:'🏆', t:'Stewart 击败', on: debtPaid('Stewart')>=DEBT_START.Stewart},
    {ic:'⭐', t:'第一笔记录', on: records.length>=1},
    {ic:'👑', t:'债务清零', on: DEBTS.every(n=>debtPaid(n)>=DEBT_START[n])},
  ];
  $('#badges').innerHTML = badges.map(b =>
    `<div class="badge ${b.on?'on':''}"><div class="ic">${b.ic}</div><div class="t">${b.t}</div></div>`).join('');

  // 今天 / 待同步 / 最近
  const todayStr = today();
  const todaySum = records.filter(r=>r.type==='支出' && r.date===todayStr).reduce((s,r)=>s+r.amount,0);
  $('#todaySpend').textContent = money(todaySum);
  $('#pendingCount').textContent = queue.length + ' 笔';
  $('#recent5').innerHTML = records.slice(0,5).map(itemHTML).join('') || '<div class="muted">还没有记录</div>';
}
function itemHTML(r){
  const sign = r.type==='收入' ? '+' : '-';
  const debt = r.debtTo ? ` · ${r.debtTo}` : '';
  return `<div class="item"><div><div>${r.category}${debt}</div>
    <div class="tag">${r.date} · ${r.pay}${r.note?' · '+r.note:''}</div></div>
    <div style="font-weight:800">${sign}${money(r.amount)}</div></div>`;
}
function renderLog(){
  $('#logList').innerHTML = records.map(itemHTML).join('') || '<div class="muted">还没有记录</div>';
}

/* ===== 上传到表格（离线排队，有网再传）===== */
let flushing = false;
async function flush(){
  if (flushing || needSetup() || !queue.length || !navigator.onLine) { renderHome(); return; }
  flushing = true;
  try{
    const rows = records.filter(r => queue.includes(r.id)).reverse();
    const res = await fetch(cfg.url, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({pin: cfg.pin, action:'add', rows})
    });
    const j = await res.json();
    if (j.ok) { queue = []; store.set('queue', queue); toast('已上传到表格'); }
    else { toast(j.error || '上传失败'); sfx.error(); }
  }catch(e){ /* 没网或网址错：留在队列，下次再传 */
    toast(navigator.onLine ? '上传失败：请检查接收器网址' : '没网络，先存在手机里'); sfx.error();
  }
  finally{ flushing=false; renderHome(); }
}
window.addEventListener('online', flush);

/* ===== 启动 ===== */
showSetup(needSetup());
if (!needSetup()) { buildPills(); go('home'); flush(); }
</script>
